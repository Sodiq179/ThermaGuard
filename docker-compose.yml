name: thermaguard

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/thermaguard.db
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      SITE_NAME: ${SITE_NAME:-ThermaGuard Demo Site, Dammam}
      SIM_SCENARIO: ${SIM_SCENARIO:-normal_day}
      SIM_SPEED: ${SIM_SPEED:-5}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - thermaguard-data:/app/data
    depends_on:
      mosquitto:
        condition: service_healthy

  simulator:
    build: ./simulator
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      TRANSPORT: mqtt
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      INTERVAL_S: 2
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  thermaguard-data:
